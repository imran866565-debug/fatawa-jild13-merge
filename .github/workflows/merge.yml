name: Merge Jild 13 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild13.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-13.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          combined = {
              'jild13-masala-11': [197, 198, 199, 200, 201],
              'jild13-masala-94': [323, 325],
              'jild13-masala-168': list(range(445, 452)),
              'jild13-masala-214': list(range(511, 575)),
          }
          for cid, expected_pages in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'] if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
          # masala-214 six-way: five section ids must be gone (absorbed)
          for sid in ['jild13-p563', 'jild13-p564', 'jild13-p566', 'jild13-p569', 'jild13-p571']:
              assert not any(it['id'] == sid for it in items), f'{sid} should have been combined away'
              print(sid, 'absorbed into masala-214')
          # masala-94 cross-id: p325 must be gone (absorbed)
          assert not any(it['id'] == 'jild13-p325' for it in items), 'jild13-p325 should have been combined away'
          print('jild13-p325 absorbed into masala-94')
          # distinct masala-92 pair kept separate
          for did in ['jild13-masala-92', 'jild13-p327']:
              assert any(it['id'] == did for it in items), f'missing distinct item {did}'
              print(did, 'present')
          assert len(items) == 966
          assert len(pages) == 580
          assert min(pages) == 4 and max(pages) == 688
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-13.json
          gh release create v1.0 jild-13.json --title "Jild 13 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 13: 966 items, 580 pages (volume_id 56). Generated by merge_jild13.py from the 11 chunk files; 4 combine cases (masala-11, masala-94 cross-id, masala-168, masala-214 six-way)." || gh release upload v1.0 jild-13.json --clobber
